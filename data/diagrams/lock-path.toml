caption = "What stands between someone with your phone and your data"
kind = "flow"
note = "Without a separate security chip, a broken secure area would leave only the first two."

[[steps]]
title = "Your lock"
text = "The passphrase or PIN you type."

[[steps]]
title = "Costly guesses"
text = "Each try needs 256 MiB of memory, which makes guessing slow even on big computers."
lit = true

[[steps]]
title = "Secure area"
text = "Limits wrong tries and holds the keys. A separate security chip, where a phone has one, adds a secret of its own."

[[steps]]
title = "Your data"
text = "Stays encrypted after every restart until the lock is entered."
