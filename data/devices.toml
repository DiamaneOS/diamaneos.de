# Supported devices. The only place that names a device: the devices page renders
# this file through the "devices" shortcode, the releases page through
# "release-downloads", the build guide lists the codenames through the
# "codenames" shortcode. Other pages say "supported device" and link to
# /devices/. Adding a device is one entry here.
#
# name      the device's name and its heading on the devices page
# codename  the build codename, as in `lunch <codename>-cur-user`
# facts     what to know before installing and for the stock OS, in Markdown.
#           Around 45 words each, no semicolons.
#           A fact may carry lists, shown as a nested list under it. Each list
#           has a title and either a one-line text or short points.

[[devices]]
  name = "Fairphone 6"
  codename = "FP6"
  [[devices.facts]]
    label = "Models"
    text = "the European and the US model are the same phone with the same firmware. The US model reports `FP6_US` in Fastboot Mode, and the web installer and the install scripts take both names. The Fairphone (Gen. 6+) is not supported."
  [[devices.facts]]
    label = "Bootloader"
    text = "must be unlockable. You allow unlocking with the OEM unlocking switch in the stock OS's developer options, as Fairphone's [unlock guide](https://support.fairphone.com/hc/en-us/articles/10492476238865-How-to-unlock-or-lock-your-Fairphone-s-bootloader) describes. Unlocking erases the phone."
  [[devices.facts]]
    label = "Bootloader keys"
    text = "hold the volume down and power buttons together until the bootloader screen (Fastboot Mode) appears. This works with the phone off and restarts a running or stuck phone into it. While the phone restarts on its own, holding volume down is enough."
  [[devices.facts]]
    label = "Hardware security"
    text = "it has no secure element exposed to Android and no memory tagging. Protected video uses Widevine L3, the software level. See the [known limitations](/limitations/)."
  [[devices.facts]]
    label = "Memory in Fastboot Mode"
    text = "the bootloader does not clear memory when it starts Fastboot Mode. Every restart is a full power reset, also one forced with the bootloader keys, and in our tests nothing that was in memory survived one."
  [[devices.facts]]
    label = "Fairphone Camera"
    text = "Fairphone's own camera app, from the App Store."
    [[devices.facts.lists]]
      title = "Works"
      text = "photo, portrait, night, pro, panorama, slow motion, time-lapse and video."
    [[devices.facts.lists]]
      title = "How it is kept safe"
      points = [
        "It has no network access, so it cannot send anything out.",
        "It needs no access to all your files. With Storage Scopes it sees only the files it made itself. The [FAQ](/faq/#fairphone-camera-storage) explains the choice.",
        "Its image processing runs in its own confined service, so a bug there stays contained.",
        "Only the app can reach that service, so other apps cannot misuse it.",
        "The closed GPU code it needs runs only in that service, so the camera service every app uses stays without it.",
        "The App Store accepts only the app's original signature, so a tampered copy is refused.",
      ]
    [[devices.facts.lists]]
      title = "Limits"
      points = [
        "Front portrait and low-light video show an error, because they would need closed GPU code inside the shared camera service.",
      ]
  [[devices.facts]]
    label = "Stock OS"
    text = '''Fairphone's [manual install guide](https://support.fairphone.com/hc/en-us/articles/18896094650513-How-to-manually-install-Android-on-your-Fairphone) links the factory images and their checksums. Its flash script restarts the phone when it ends. To [lock on the stock OS](/install/cli/#locking-on-the-stock-os), hold the bootloader keys during that restart, so the phone comes back to the bootloader before Android starts. Leave the script unchanged: its checksum check covers the script too.'''
  [[devices.facts]]
    label = "Stock install"
    text = '''the bootloader can stop while it writes `super.img`, with "Error reading sparse file". Restart the phone into the bootloader. Then switch to fastbootd with `fastboot reboot fastboot` and write the logical partitions from `super.img` one by one.'''
