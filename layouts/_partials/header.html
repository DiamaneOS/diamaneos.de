{{- $page := . -}}
<header class="site-header">
  <div class="wrap header-in">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="DiamaneOS home"{{ if .IsHome }} aria-current="page"{{ end }}>
      {{- partial "brand-svg.html" (dict "file" "diamaneos-lockup-light.svg" "class" "lockup") -}}
    </a>
    <nav class="nav" aria-label="Main">
      <ul>
        {{- range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if $page.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
