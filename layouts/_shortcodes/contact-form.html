<form class="contact-form" action="/contact/submit" method="post" accept-charset="UTF-8" aria-labelledby="contact">
  <div class="contact-field">
    <label for="contact-email">Your email</label>
    <input id="contact-email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required spellcheck="false" aria-describedby="contact-email-help">
    <p id="contact-email-help" class="field-help">We use this address to reply to you.</p>
  </div>
  <div class="contact-field">
    <label for="contact-message">Message</label>
    <textarea id="contact-message" name="message" rows="8" maxlength="4000" required aria-describedby="contact-message-help"></textarea>
    <p id="contact-message-help" class="field-help">Up to 4,000 characters. Please leave out passwords, private keys and unnecessary personal information.</p>
  </div>
  <p class="field-help">Your email and message are processed to answer your request. Read our <a href="{{ "legal/#privacy" | relURL }}">privacy policy</a>.</p>
  <button type="submit">Send message</button>
</form>
