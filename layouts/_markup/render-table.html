<div class="table-scroll" role="region" aria-label="Scrollable table" tabindex="0">
<table>
  <thead>
    {{- range .THead }}
    <tr>
      {{- range . }}
      <th scope="col" class="table-align-{{ .Alignment | default "left" }}">{{ .Text }}</th>
      {{- end }}
    </tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
    <tr>
      {{- range . }}
      <td class="table-align-{{ .Alignment | default "left" }}">{{ .Text }}</td>
      {{- end }}
    </tr>
    {{- end }}
  </tbody>
</table>
</div>
