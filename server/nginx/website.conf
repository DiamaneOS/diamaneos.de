# Include in the existing hardened http context with its default host refusal.
limit_req_zone $binary_remote_addr zone=website-contact-ip:1m rate=1r/m;
limit_req_zone $server_name zone=website-contact-global:1m rate=1r/m;

server {
    listen 80;
    listen [::]:80;
    server_name diamaneos.de www.diamaneos.de;
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt/webroot;
        try_files $uri =404;
    }
    location / { return 301 https://diamaneos.de$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.diamaneos.de;
    ssl_certificate /etc/letsencrypt/live/diamaneos-website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diamaneos-website/privkey.pem;
    include website-headers.conf;
    return 301 https://diamaneos.de$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name diamaneos.de;
    ssl_certificate /etc/letsencrypt/live/diamaneos-website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diamaneos-website/privkey.pem;
    root /srv/diamaneos-website/current;
    index index.html;
    absolute_redirect off;
    autoindex off;
    disable_symlinks on from=$document_root;
    access_log off;
    error_log /dev/null crit;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 15s;
    limit_conn http-limit 16;
    # The http block's keepalive_timeout 0 ends each HTTP/2 connection after one
    # request. One connection for a page and its files, as on the download servers.
    keepalive_requests 64;
    keepalive_timeout 15s;
    include website-headers.conf;
    error_page 404 /404.html;

    location = /contact/submit {
        if ($request_method != POST) { return 405; }
        if ($http_origin != "https://diamaneos.de") { return 303 /contact/invalid/; }
        if ($http_transfer_encoding != "") { return 303 /contact/invalid/; }
        client_max_body_size 64k;
        client_body_buffer_size 64k;
        client_body_in_file_only off;
        limit_req zone=website-contact-ip burst=2 nodelay;
        limit_req zone=website-contact-global burst=3 nodelay;
        limit_req_status 429;
        error_page 413 = @contact-invalid;
        error_page 429 = @contact-rate-limited;
        error_page 502 503 504 = @contact-unavailable;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host diamaneos.de;
        proxy_set_header Origin $http_origin;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_set_header Connection close;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 6s;
        proxy_read_timeout 35s;
        proxy_pass http://unix:/run/diamaneos-contact/ingress.sock;
    }
    location @contact-invalid { return 303 /contact/invalid/; }
    location @contact-rate-limited { return 303 /contact/rate-limited/; }
    location @contact-unavailable { return 303 /contact/unavailable/; }

    location = /.well-known/security.txt {
        if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }
        types { }
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }
    location = /security-public.asc {
        if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }
        types { }
        default_type application/pgp-keys;
        try_files $uri =404;
    }
    location = /security-public.pgp {
        if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }
        types { }
        default_type application/pgp-keys;
        try_files $uri =404;
    }
    location ^~ /.well-known/openpgpkey/ {
        if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }
        if ($uri !~ ^/\.well-known/openpgpkey/(?:policy|hu/t5s8ztdbon8yzntexy6oz5y48etqsnbb)$) { return 404; }
        types { }
        default_type application/octet-stream;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), payment=(), serial=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }
    # The releases feed. Thunderbird fetches feeds from another origin, so the
    # feed allows cross-origin reads, as GrapheneOS's does. The header set replaces
    # the server's, so it is repeated here.
    location = /releases.atom {
        if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }
        types { }
        default_type application/atom+xml;
        charset utf-8;
        charset_types application/atom+xml;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), payment=(), serial=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
    # The public keys on /documentation/keys/. Only these files, before the
    # rule below that refuses .pem names.
    location ^~ /keys/ {
        if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }
        if ($uri !~ ^/keys/(?:avb_pkmd\.bin|avb\.pub\.pem|factory\.allowed_signers|apps\.0\.pub|release-list\.pub\.pem)$) { return 404; }
        types { application/octet-stream bin; }
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }
    # The short link the setup wizard shows, typed on another device.
    location ~* ^/ubl/?$ { return 301 /faq/#bootloader-locking-setup; }
    location ~ (^|/)\. { return 404; }
    location ~* \.(?:py|conf|toml|json|pem|key|cred|sqlite|db|sh)$ { return 404; }
    location ~* \.svg$ {
        if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
    location / {
        if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }
        try_files $uri $uri/ =404;
    }
}
